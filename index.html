<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samay</title>
<meta name="description" content="Samay — exercices de respiration guidés.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<div id="bg-image-layer" class="bg-image-layer"></div>
<div class="bg-tint-layer"></div>

<header class="topbar">
  <div class="brand">
    <h1 class="logo">Samay</h1>
    <p class="subtitle" id="app-subtitle" data-i18n="subtitle"></p>
  </div>
  <button id="settings-toggle" class="icon-btn" aria-label="Réglages" data-i18n-aria="ariaSettings">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <line x1="4" y1="6" x2="20" y2="6"></line><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
      <line x1="4" y1="12" x2="20" y2="12"></line><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"></circle>
      <line x1="4" y1="18" x2="20" y2="18"></line><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"></circle>
    </svg>
  </button>
</header>

<main>

  <section class="presets" aria-label="Sessions prédéfinies">
    <button class="preset-btn icon-btn" data-preset="morning" aria-label="Morning">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 18h16"></path>
        <path d="M6.5 18a5.5 5.5 0 0 1 11 0"></path>
        <path d="M12 4v3M5.5 9l1.8 1.8M18.5 9l-1.8 1.8"></path>
      </svg>
    </button>
    <button class="preset-btn icon-btn" data-preset="box" aria-label="Box">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <rect x="5" y="5" width="14" height="14" rx="1.5"></rect>
      </svg>
    </button>
    <button class="preset-btn icon-btn" data-preset="daily" aria-label="Daily">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
      </svg>
    </button>
    <button class="preset-btn icon-btn" data-preset="custom" aria-label="Custom">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"></path>
        <path d="M14 6l3 3"></path>
      </svg>
    </button>
  </section>

  <p class="preset-description" id="preset-description"></p>

  <section class="stage" aria-live="polite">
    <div class="ring-wrap">
      <div class="ring" id="ring">
        <span class="phase-count" id="phase-count"></span>
      </div>
    </div>
    <div class="session-meta">
      <span id="round-counter"></span>
    </div>
    <div class="controls">
      <button id="start-btn" class="icon-btn" aria-label="Démarrer" data-i18n-aria="ariaStart">
        <svg class="icon icon-fill" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"></polygon></svg>
      </button>
      <button id="pause-btn" class="icon-btn" disabled aria-label="Pause">
        <svg class="icon icon-fill icon-pause-symbol" viewBox="0 0 24 24">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
        <svg class="icon icon-fill icon-resume-symbol" viewBox="0 0 24 24" style="display:none">
          <polygon points="7,4 20,12 7,20"></polygon>
        </svg>
      </button>
      <button id="reset-btn" class="icon-btn" disabled aria-label="Réinitialiser" data-i18n-aria="ariaReset">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 1 3 6.7"></path><polyline points="3 17 3 21 7 21"></polyline>
        </svg>
      </button>
    </div>
  </section>

  <section class="panel hidden" id="config-panel" aria-label="Configuration de la session">
    <h2 data-i18n="sessionConfigTitle">Configuration</h2>

    <div class="field-grid">
      <label class="field">
        <span data-i18n="fieldInhale">Inspiration (s)</span>
        <input type="number" id="cfg-inhale" min="0" max="30" value="4">
      </label>
      <label class="field">
        <span data-i18n="fieldHoldIn">Rétention haute (s)</span>
        <input type="number" id="cfg-hold-in" min="0" max="60" value="4">
      </label>
      <label class="field">
        <span data-i18n="fieldExhale">Expiration (s)</span>
        <input type="number" id="cfg-exhale" min="0" max="30" value="4">
      </label>
      <label class="field">
        <span data-i18n="fieldHoldOut">Rétention basse (s)</span>
        <input type="number" id="cfg-hold-out" min="0" max="60" value="4">
      </label>
      <label class="field">
        <span data-i18n="fieldRounds">Rounds</span>
        <input type="number" id="cfg-rounds" min="1" max="99" value="6">
      </label>
    </div>
  </section>

</main>

<aside id="settings-drawer" class="drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2 data-i18n="settingsTitle">Réglages</h2>
    <button id="drawer-close" class="icon-btn" aria-label="Fermer" data-i18n-aria="ariaClose">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line>
      </svg>
    </button>
  </div>

  <div class="drawer-section">
    <span class="drawer-label" data-i18n="languageLabel">Langue</span>
    <div class="segmented flags" id="lang-switch">
      <button type="button" class="segmented-btn" data-lang-choice="fr" aria-label="Français">
        <svg viewBox="0 0 40 30" class="flag"><rect width="13.3" height="30" fill="#0055A4"></rect><rect x="13.3" width="13.4" height="30" fill="#fff"></rect><rect x="26.7" width="13.3" height="30" fill="#EF4135"></rect></svg>
      </button>
      <button type="button" class="segmented-btn" data-lang-choice="en" aria-label="English">
        <svg viewBox="0 0 40 30" class="flag">
          <clipPath id="flagLeft"><rect width="20" height="30"></rect></clipPath>
          <clipPath id="flagRight"><rect x="20" width="20" height="30"></rect></clipPath>
          <g clip-path="url(#flagLeft)">
            <rect width="40" height="30" fill="#B22234"></rect>
            <rect y="2.3" width="40" height="2.3" fill="#fff"></rect>
            <rect y="6.9" width="40" height="2.3" fill="#fff"></rect>
            <rect y="11.5" width="40" height="2.3" fill="#fff"></rect>
            <rect y="16.1" width="40" height="2.3" fill="#fff"></rect>
            <rect y="20.7" width="40" height="2.3" fill="#fff"></rect>
            <rect y="25.3" width="40" height="2.3" fill="#fff"></rect>
            <rect width="16" height="16" fill="#3C3B6E"></rect>
          </g>
          <g clip-path="url(#flagRight)">
            <rect x="20" width="20" height="30" fill="#012169"></rect>
            <path d="M20 0 L40 30 M40 0 L20 30" stroke="#fff" stroke-width="4"></path>
            <path d="M20 0 L40 30 M40 0 L20 30" stroke="#C8102E" stroke-width="1.6"></path>
            <rect x="28" width="4" height="30" fill="#fff"></rect>
            <rect x="20" y="13" width="20" height="4" fill="#fff"></rect>
            <rect x="29" width="2" height="30" fill="#C8102E"></rect>
            <rect x="20" y="14" width="20" height="2" fill="#C8102E"></rect>
          </g>
        </svg>
      </button>
    </div>
  </div>

  <div class="drawer-section">
    <span class="drawer-label" data-i18n="themeLabel">Thème</span>
    <div class="segmented" id="theme-switch">
      <button type="button" class="segmented-btn" data-theme-choice="light" data-i18n="themeLight">Clair</button>
      <button type="button" class="segmented-btn" data-theme-choice="dark" data-i18n="themeDark">Sombre</button>
    </div>
  </div>

  <div class="drawer-section">
    <span class="drawer-label" data-i18n="roundInfoLabel">Indications sous le rond</span>
    <div class="segmented" id="round-info-switch">
      <button type="button" class="segmented-btn" data-choice="show" data-i18n="show">Afficher</button>
      <button type="button" class="segmented-btn" data-choice="hide" data-i18n="hide">Masquer</button>
    </div>
  </div>

  <div class="drawer-section">
    <span class="drawer-label" data-i18n="phaseHintsLabel">Indications dans le rond</span>
    <div class="segmented" id="phase-hints-switch">
      <button type="button" class="segmented-btn" data-choice="show" data-i18n="show">Afficher</button>
      <button type="button" class="segmented-btn" data-choice="hide" data-i18n="hide">Masquer</button>
    </div>
  </div>

  <div class="drawer-section">
    <label class="drawer-label" for="cfg-music" data-i18n="fieldMusic">Musique de fond</label>
    <select id="cfg-music"></select>
  </div>

  <div class="drawer-section">
    <label class="drawer-label" for="cfg-image" data-i18n="fieldImage">Image de fond</label>
    <select id="cfg-image"></select>
  </div>
</aside>
<div id="drawer-backdrop" class="drawer-backdrop"></div>

<audio id="bg-audio" loop preload="none"></audio>

<script src="js/i18n.js?v=7"></script>
<script src="js/presets.js?v=7"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
