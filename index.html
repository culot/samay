<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respire</title>
<meta name="description" content="Exercices de respiration guidés — box breathing, 4-7-8, cohérence cardiaque et sessions personnalisées.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1 class="logo">respire</h1>
  <button id="theme-toggle" class="icon-btn" aria-label="Changer de thème" title="Thème clair / sombre">
    <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path></svg>
  </button>
</header>

<main>

  <section class="presets" aria-label="Sessions prédéfinies">
    <button class="preset-btn" data-preset="morning">Morning</button>
    <button class="preset-btn" data-preset="box">Box</button>
    <button class="preset-btn" data-preset="daily">Daily</button>
    <button class="preset-btn" data-preset="custom">Custom</button>
  </section>

  <section class="stage" aria-live="polite">
    <div class="ring-wrap">
      <div class="ring" id="ring">
        <span class="phase-label" id="phase-label">Prêt</span>
        <span class="phase-count" id="phase-count"></span>
      </div>
    </div>
    <div class="session-meta">
      <span id="round-counter">Round 0 / 0</span>
    </div>
    <div class="controls">
      <button id="start-btn" class="primary-btn">Démarrer</button>
      <button id="pause-btn" class="secondary-btn" disabled>Pause</button>
      <button id="reset-btn" class="secondary-btn" disabled>Réinitialiser</button>
    </div>
  </section>

  <section class="panel" id="config-panel" aria-label="Configuration de la session">
    <h2>Configuration</h2>

    <div class="field-grid">
      <label class="field">
        <span>Inspiration (s)</span>
        <input type="number" id="cfg-inhale" min="0" max="30" value="4">
      </label>
      <label class="field">
        <span>Rétention haute (s)</span>
        <input type="number" id="cfg-hold-in" min="0" max="60" value="4">
      </label>
      <label class="field">
        <span>Expiration (s)</span>
        <input type="number" id="cfg-exhale" min="0" max="30" value="4">
      </label>
      <label class="field">
        <span>Rétention basse (s)</span>
        <input type="number" id="cfg-hold-out" min="0" max="60" value="4">
      </label>
      <label class="field">
        <span>Rounds</span>
        <input type="number" id="cfg-rounds" min="1" max="99" value="6">
      </label>
      <label class="field">
        <span>Musique de fond</span>
        <select id="cfg-music">
          <option value="none">Aucune</option>
        </select>
      </label>
    </div>

    <p class="hint" id="config-hint">Modifie librement ces valeurs, puis clique sur <strong>Custom</strong> pour les appliquer.</p>
  </section>

  <p class="disclaimer">Ceci n'est pas un avis médical. Arrête l'exercice si tu te sens mal à l'aise, et demande conseil à un professionnel de santé en cas de doute ou de condition particulière.</p>

</main>

<audio id="bg-audio" loop preload="none"></audio>

<script src="js/presets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
